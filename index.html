<!DOCYTPE html>
    <html>

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Box model</title>

        <link rel="stylesheet" href="./form.css">
    </head>

    <body>
        <div class="card">

            <h1>Student Course Registration</h1>

            <p class="subtitle">
                Fill in your details below to register for your preferred course.
            </p>

            <form>

                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="name">
                </div>

                <div class="input-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone">
                </div>

                <div class="input-group">
                    <label>Gmail Address</label>
                    <input type="email" id="gmail">
                </div>

                <div class="input-group">
                    <label>B.Tech Stream</label>
                    <select id="branch">
                        <option value="">Choose Branch</option>
                        <option>CSE</option>
                        <option>IT</option>
                        <option>ECE</option>
                        <option>MECH</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Select Any 5 Courses</label>

                    <div class="course-list">
                        <label><input type="checkbox" name="course" value="Python Programming"> Python
                            Programming</label>
                        <label><input type="checkbox" name="course" value="Java Programming"> Java Programming</label>
                        <label><input type="checkbox" name="course" value="C Programming"> C Programming</label>
                        <label><input type="checkbox" name="course" value="C++ Programming"> C++ Programming</label>
                        <label><input type="checkbox" name="course" value="Web Development"> Web Development</label>
                        <label><input type="checkbox" name="course" value="Frontend Development"> Frontend
                            Development</label>
                        <label><input type="checkbox" name="course" value="Backend Development"> Backend
                            Development</label>
                        <label><input type="checkbox" name="course" value="Full Stack Development"> Full Stack
                            Development</label>
                        <label><input type="checkbox" name="course" value="Data Analytics"> Data Analytics</label>
                        <label><input type="checkbox" name="course" value="Data Science"> Data Science</label>
                        <label><input type="checkbox" name="course" value="Machine Learning"> Machine Learning</label>
                        <label><input type="checkbox" name="course" value="Artificial Intelligence"> Artificial
                            Intelligence</label>
                        <label><input type="checkbox" name="course" value="Cloud Computing"> Cloud Computing</label>
                        <label><input type="checkbox" name="course" value="Cyber Security"> Cyber Security</label>
                        <label><input type="checkbox" name="course" value="AWS"> AWS</label>
                        <label><input type="checkbox" name="course" value="DevOps"> DevOps</label>
                        <label><input type="checkbox" name="course" value="UI/UX Design"> UI/UX Design</label>
                        <label><input type="checkbox" name="course" value="Digital Marketing"> Digital Marketing</label>
                        <label><input type="checkbox" name="course" value="Blockchain"> Blockchain</label>
                        <label><input type="checkbox" name="course" value="Mobile App Development"> Mobile App
                            Development</label>
                    </div>
                </div>

                <div class="input-group">
                    <label>City</label>
                    <input type="text" id="city">
                </div>

                <div class="input-group">
                    <label>Comments</label>
                    <textarea id="comments"></textarea>
                </div>

                <button>Register Now</button>

            </form>

        </div>
        <script>

            const WEB_APP_URL =
                "https://script.google.com/macros/s/AKfycbyfW7opW95xxTuLTfveX7a0OcKz_bjXHpId-8RfvnwXYShbdVTALU9K7FFWFQhMTvNO/exec";


            const courseCheckboxes =
                document.querySelectorAll('input[name="course"]');

            courseCheckboxes.forEach((checkbox) => {

                checkbox.addEventListener("change", function () {

                    const selectedCourses =
                        document.querySelectorAll(
                            'input[name="course"]:checked'
                        );

                    if (selectedCourses.length > 5) {

                        this.checked = false;

                        alert(
                            "You can select only 5 courses."
                        );

                    }

                });

            });


            document.querySelector("form")
                .addEventListener("submit", async function (e) {

                    e.preventDefault();

                    const selectedCourses =
                        Array.from(
                            document.querySelectorAll(
                                'input[name="course"]:checked'
                            )
                        ).map(course => course.value);

                    if (selectedCourses.length !== 5) {

                        alert(
                            "Please select exactly 5 courses."
                        );

                        return;

                    }

                    const data = {

                        name:
                            document.getElementById("name").value,

                        phone:
                            document.getElementById("phone").value,

                        gmail:
                            document.getElementById("gmail").value,

                        branch:
                            document.getElementById("branch").value,

                        courses:
                            selectedCourses.join(", "),

                        city:
                            document.getElementById("city").value,

                        comments:
                            document.getElementById("comments").value

                    };

                    try {

                        console.log(data);

                        const response =
                            await fetch(WEB_APP_URL, {

                                method: "POST",

                                body: JSON.stringify(data)

                            });

                        const result =
                            await response.json();

                        if (result.status === "success") {

                            alert(
                                "Registration Submitted Successfully!"
                            );

                            document.querySelector("form").reset();

                        }

                    } catch (error) {

                        alert(
                            "Error submitting form"
                        );

                    }

                });

        </script>
    </body>

    </html>
